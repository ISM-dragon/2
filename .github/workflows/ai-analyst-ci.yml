name: AI Analyst CI

on:
  push:
    branches: ["main", "arena/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-analyst-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-analyst-tests:
    name: AI Analyst unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The repository intentionally does not commit a Gradle wrapper binary; the
      # action provisions the exact distribution named in gradle/wrapper properties.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      # The CRM suite (com.example.domain.crm.*) is pure JVM (no Android/Room imports, see
      # LeadCrmIsolationTest), so it runs in the same invocation as the analyst tests.
      - name: Run AI Analyst test suite
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            --tests "com.example.RealEstateAnalystOutputValidatorTest" \
            --tests "com.example.RealEstateAnalystInputFactoryTest" \
            --tests "com.example.RealEstateAnalystHardeningTest" \
            --tests "com.example.domain.crm.*" \
            >"$RUNNER_TEMP/ai-analyst-gradle.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/ai-analyst-gradle.log"
          if [ "$status" -ne 0 ]; then
            echo "Gradle failed; publishing the last diagnostic lines as check annotations."
            {
              grep -E '(^FAILURE:|^\\* What went wrong:|^Execution failed for task|^Caused by:|^[[:space:]]*e: |error:|Unresolved reference|Expecting an element|Could not resolve|Could not find)' \
                "$RUNNER_TEMP/ai-analyst-gradle.log" | tail -n 30
              tail -n 5 "$RUNNER_TEMP/ai-analyst-gradle.log"
            } | while IFS= read -r line; do
              escaped="${line//'%'/'%25'}"
              escaped="${escaped//$'\r'/'%0D'}"
              escaped="${escaped//$'\n'/'%0A'}"
              echo "::error::$escaped"
            done
          fi
          exit "$status"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-analyst-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
