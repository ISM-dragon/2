name: Seller outreach CI

on:
  push:
    branches: ["main", "arena/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seller-outreach-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seller-outreach-tests:
    name: Seller outreach unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Run seller outreach tests
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            --tests "com.example.domain.outreach.SellerOutreachEngineTest" \
            --tests "com.example.domain.outreach.OutreachSafetyTest" \
            >"$RUNNER_TEMP/seller-outreach-gradle.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/seller-outreach-gradle.log"
          if [ "$status" -ne 0 ]; then
            echo "Gradle failed; publishing the last diagnostic lines as check annotations."
            {
              grep -E '(^FAILURE:|^\\* What went wrong:|^Execution failed for task|^Caused by:|^[[:space:]]*e: |error:|Unresolved reference|Expecting an element|Could not resolve|Could not find)' \
                "$RUNNER_TEMP/seller-outreach-gradle.log" | tail -n 30
              tail -n 5 "$RUNNER_TEMP/seller-outreach-gradle.log"
            } | while IFS= read -r line; do
              escaped="${line//'%'/'%25'}"
              escaped="${escaped//$'\r'/'%0D'}"
              escaped="${escaped//$'\n'/'%0A'}"
              echo "::error::$escaped"
            done
          fi
          exit "$status"
