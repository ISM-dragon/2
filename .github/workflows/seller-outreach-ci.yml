name: Seller outreach CI

on:
  push:
    branches: ["main", "arena/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seller-outreach-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seller-outreach-tests:
    name: Seller outreach unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      # debug.keystore is gitignored, so CI creates the standard Android debug key for this run only.
      - name: Create CI debug keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run seller outreach tests
        shell: bash
        run: |
          bash .github/scripts/run-gradle-gate.sh seller-outreach-gradle \
            --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            --tests "com.example.domain.outreach.SellerOutreachEngineTest" \
            --tests "com.example.domain.outreach.OutreachSafetyTest"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seller-outreach-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            ${{ runner.temp }}/seller-outreach-gradle.log
          if-no-files-found: warn
