name: E2E reliability CI

# Reliability audit of the core property-to-offer workflow: the cross-boundary suites
# (com.example.reliability.* plus the persisted-path suites they build on), the two standalone JVM
# modules the app consumes, and the repository's JVM-free data-layer guards.
#
# Results are published as check annotations AND as a PR comment, so the numbers are readable even
# when the raw job log is not reachable.

on:
  push:
    branches: ["main", "arena/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: e2e-reliability-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-layer-guards:
    name: Data layer + underwriting guards (no JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # The Room guard verifies the migrations against the historical entity declarations, pinned by
        # revision, so it needs the full history rather than a shallow checkout.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Room data layer guard
        shell: bash
        run: |
          set +e
          python3 tools/room_schema_guard.py >"$RUNNER_TEMP/schema-guard.log" 2>&1
          status=$?
          tail -n 40 "$RUNNER_TEMP/schema-guard.log"
          if [ "$status" -ne 0 ]; then
            {
              echo "room_schema_guard failed:"
              grep -E "^(FAIL|ERROR|guard|[0-9]+\)|Traceback|  )" "$RUNNER_TEMP/schema-guard.log" | tail -n 20
            } | while IFS= read -r line; do
              escaped="${line//'%'/'%25'}"
              echo "::error::$escaped"
            done
          fi
          exit "$status"

      - name: Underwriting oracle self-check
        shell: bash
        working-directory: tools/underwriting_oracle
        run: |
          set +e
          python3 selfcheck.py >"$RUNNER_TEMP/oracle-selfcheck.log" 2>&1
          status=$?
          tail -n 12 "$RUNNER_TEMP/oracle-selfcheck.log"
          if [ "$status" -ne 0 ]; then
            grep -E "^FAIL" "$RUNNER_TEMP/oracle-selfcheck.log" | head -n 20 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Golden vectors are up to date
        shell: bash
        working-directory: tools/underwriting_oracle
        run: |
          set +e
          python3 generate_golden_vectors.py --check >"$RUNNER_TEMP/golden-vectors.log" 2>&1
          status=$?
          tail -n 6 "$RUNNER_TEMP/golden-vectors.log"
          if [ "$status" -ne 0 ]; then
            echo "::error::app/src/test/resources/underwriting/golden_vectors.json does not match the oracle; regenerate it (the Kotlin engine and the oracle would diverge in CI next)."
          fi
          exit "$status"

  reliability-suite:
    name: Property-to-offer integration suites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      # The app suites below are the ones that cross a module or persistence boundary: the new
      # reliability harness, the Room-backed repository/migration suites, the send ledger and the
      # URL-intelligence bridge. Everything is run against real Room + real SQLite, with fakes only
      # for the outside world (portal transport, Gmail, Gemini).
      - name: Run app integration suites
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            --tests "com.example.reliability.*" \
            --tests "com.example.data.*" \
            --tests "com.example.PropertySourceDeduplicationIntegrationTest" \
            --tests "com.example.PropertyUrlIntelligenceTest" \
            --tests "com.example.PropertyUrlImportServiceTest" \
            --tests "com.example.PropertyUrlMapperTest" \
            --tests "com.example.OfferSendIdempotencyTest" \
            --tests "com.example.OfferEngineTest" \
            --tests "com.example.GmailServiceConcurrencyTest" \
            --tests "com.example.GmailMimeAndRetryPolicyTest" \
            --tests "com.example.HardeningRecoveryScenariosTest" \
            --tests "com.example.DealAnalysisOrchestratorTest" \
            --tests "com.example.Automation*" \
            --tests "com.example.automation.*" \
            >"$RUNNER_TEMP/app-integration-gradle.log" 2>&1
          status=$?
          tail -n 40 "$RUNNER_TEMP/app-integration-gradle.log"
          if [ "$status" -ne 0 ]; then
            # The job log is not always readable from outside, so the diagnosis has to leave the log:
            # compile errors, failing tests and the build's own summary become check annotations
            # (GitHub keeps only the first handful, so the full picture goes into the PR comment).
            {
              grep -E '(^e: file:|^> Task .*FAILED$|^FAILURE:|^Execution failed for task|^\* What went wrong:|^Caused by:|Unresolved reference|No value passed for parameter|tests completed)' \
                "$RUNNER_TEMP/app-integration-gradle.log"
              grep -E -A 2 ' FAILED$' "$RUNNER_TEMP/app-integration-gradle.log" | grep -v "^--$"
            } >"$RUNNER_TEMP/app-integration-diagnosis.txt" 2>/dev/null
            head -n 12 "$RUNNER_TEMP/app-integration-diagnosis.txt" | while IFS= read -r line; do
              escaped="${line//'%'/'%25'}"
              echo "::error::$escaped"
            done
            cat "$RUNNER_TEMP/app-integration-diagnosis.txt"
          fi
          exit "$status"

      - name: Run standalone module suites
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace \
            :urlintelligence:test :repairestimator:test \
            >"$RUNNER_TEMP/module-gradle.log" 2>&1
          status=$?
          tail -n 40 "$RUNNER_TEMP/module-gradle.log"
          if [ "$status" -ne 0 ]; then
            {
              grep -E '(^e: file:|^> Task .*FAILED$|^FAILURE:|^Execution failed for task|^Caused by:|Unresolved reference|tests completed)' \
                "$RUNNER_TEMP/module-gradle.log"
              grep -E -A 2 ' FAILED$' "$RUNNER_TEMP/module-gradle.log" | grep -v "^--$"
            } >"$RUNNER_TEMP/module-diagnosis.txt" 2>/dev/null
            head -n 8 "$RUNNER_TEMP/module-diagnosis.txt" | while IFS= read -r line; do
              echo "::error::${line//'%'/'%25'}"
            done
            cat "$RUNNER_TEMP/module-diagnosis.txt"
          fi
          exit "$status"

      - name: Collect test results
        if: always()
        shell: bash
        run: |
          set +e
          python3 tools/ci_junit_report.py \
            --summary "$RUNNER_TEMP/reliability-summary.md" \
            --failures "$RUNNER_TEMP/reliability-failures.txt" \
            app/build/test-results \
            urlintelligence/build/test-results \
            repairestimator/build/test-results \
            >"$RUNNER_TEMP/reliability-report.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/reliability-report.log"
          # Re-emit the machine-readable line so it survives in the annotations, and print the table
          # so the numbers are visible in the log too.
          cat "$RUNNER_TEMP/reliability-summary.md"
          exit "$status"

      - name: Publish results on the pull request
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          SUMMARY="$RUNNER_TEMP/reliability-summary.md"
          if [ ! -s "$SUMMARY" ]; then
            {
              echo "## Test results"
              echo
              echo "> No JUnit XML was produced, so the build failed before any test report existed."
              echo
              echo '```'
              head -n 60 "$RUNNER_TEMP/app-integration-diagnosis.txt" 2>/dev/null
              head -n 20 "$RUNNER_TEMP/module-diagnosis.txt" 2>/dev/null
              echo '```'
            } >"$SUMMARY"
          fi
          {
            echo "### E2E reliability audit"
            echo ""
            echo "run: \`$GITHUB_RUN_ID\` · commit: \`${GITHUB_SHA:0:7}\` · [annotations](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo ""
            cat "$SUMMARY"
          } >"$RUNNER_TEMP/comment.md"
          {
            echo "<!-- e2e-reliability-ci -->"
            cat "$RUNNER_TEMP/comment.md"
          } >"$RUNNER_TEMP/body.md"
          jq -Rs '{body: .}' "$RUNNER_TEMP/body.md" >"$RUNNER_TEMP/payload.json"
          PR_NUMBER="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' 2>/dev/null)"
          if [ -n "$PR_NUMBER" ]; then
            EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq '.[] | select((.body | startswith("<!-- e2e-reliability-ci -->"))) | .id' 2>/dev/null | head -1)"
            if [ -n "$EXISTING" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING" --input "$RUNNER_TEMP/payload.json" >/dev/null
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$RUNNER_TEMP/payload.json" >/dev/null
            fi
          fi
          exit 0

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reliability-test-report
          path: |
            app/build/reports/tests
            app/build/test-results
            urlintelligence/build/test-results
            repairestimator/build/test-results
          if-no-files-found: warn
